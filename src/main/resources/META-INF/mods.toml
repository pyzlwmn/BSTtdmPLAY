modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

# 表名统一用 "${mod_id}"（带引号！），会自动展开成 gradle.properties 里的 mod_id，
# 永远跟自己 [[mods]] 段的 modId 一致 → IDEA 不报红线
[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "fpsmatch"
mandatory = true
versionRange = "[1.3.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "modernui"
mandatory = true
versionRange = "[3.11.0,)"
ordering = "NONE"
side = "BOTH"
