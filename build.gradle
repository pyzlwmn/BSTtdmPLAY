plugins {
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.140'
}

group = mod_group_id
version = mod_version

base { archivesName = mod_id }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

legacyForge {
    version = '1.20.1-47.4.23'
    parchment { minecraftVersion = '1.20.1'; mappingsVersion = '2023.09.03' }
    runs {
        // 本地专用服务器：两个客户端都连它，实现双人联机
        server {
            server()
            programArgument '--nogui'
            gameDirectory = project.file('run-server')
        }
        // 客户端1（主窗口）：自动连接本地服务器
        client {
            client()
            gameDirectory = project.file('run')
            programArgument '--server'
            programArgument 'localhost'
            programArgument '--port'
            programArgument '25565'
        }
        // 客户端2（第二个窗口）：独立存档目录，不同用户名+UUID，同样自动连接本地服务器
        client2 {
            client()
            gameDirectory = project.file('run-client2')
            programArgument '--username'
            programArgument 'Player2'
            programArgument '--uuid'
            programArgument '069a79f4-44e9-4726-a5be-fca90e38aaf5'
            programArgument '--server'
            programArgument 'localhost'
            programArgument '--port'
            programArgument '25565'
        }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

// 勾了 Mixins 才放开：
// mixin { add sourceSets.main, "${mod_id}.refmap.json"; config "${mod_id}.mixins.json" }

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenCentral()
    maven { name = 'PTCrysReleases'; url = uri('https://maven.ptcrys.net/releases') }
    maven { name = 'CurseMaven'; url = 'https://www.cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { name = 'IzzelAliz'; url = 'https://maven.izzel.io/releases/' }
    maven { name = "Ptcrys"; url = "https://maven.ptcrys.net/snapshots" }
    maven { name = "PtcrysSnapshots"; url = "https://maven.ptcrys.net/snapshots" }
    mavenLocal()
    maven { name = "PtcrysSnapshots"; url = "https://maven.ptcrys.net/snapshots" }
    exclusiveContent {
        forRepository { maven { url = "https://api.modrinth.com/maven/" } }
        filter { includeGroup("maven.modrinth") }
    }
    maven { name = "KotlinForForge"; url = "https://thedarkcolour.github.io/KotlinForForge/" }
}

def withoutMinecraftLibraries = { dep ->
    dep.exclude group: 'org.apache.logging.log4j'
    dep.exclude group: 'com.google.code.findbugs', module: 'jsr305'
    dep.exclude group: 'org.jetbrains', module: 'annotations'
    dep.exclude group: 'com.ibm.icu', module: 'icu4j'
    dep.exclude group: 'it.unimi.dsi', module: 'fastutil'
}

dependencies {
// FPSMatch 本体
    modImplementation "net.ptcrys:FPSMatch:1.26.9-SNAPSHOT"

    // FPSMatch 运行必需的（它自己都声明成 modCompileOnly/compileOnly，不会传递过来）
    modRuntimeOnly "maven.modrinth:kotlin-for-forge:4.11.0"
    modRuntimeOnly "maven.modrinth:cloth-config:11.1.136+forge"

    // ModernUI：★ 编译期也要可见（配件页/背包页要用它的 Fragment/View 重写 UI）
    modCompileOnly "icyllis.modernui:ModernUI-Forge:1.20.1-3.12.0.1"      // ← 新增
    modRuntimeOnly "icyllis.modernui:ModernUI-Forge:1.20.1-3.12.0.1"      // ← 原有，别删
    compileOnly "icyllis.modernui:ModernUI-Core:3.12.0"                   // ← 新增（Fragment/TextView 在这）
    withoutMinecraftLibraries(additionalRuntimeClasspath(implementation("icyllis.modernui:ModernUI-Core:3.12.0")))
    withoutMinecraftLibraries(additionalRuntimeClasspath(implementation("icyllis.modernui:ModernUI-Markflow:3.12.0")))

    // TaCZ（我们的背包/配件要用枪械物品；代码里走反射，所以编译期可以不要）
    modCompileOnly "maven.modrinth:timeless-and-classics-zero:1.1.7-hotfix"
    modRuntimeOnly "maven.modrinth:timeless-and-classics-zero:1.1.7-hotfix"
}

configurations.configureEach {
    exclude group: 'io.github.erdtman', module: 'java-json-canonicalization'
    // ③ 保险：把可能存在的独立 Kotlin 也排掉（先别开，等①单独试过再加）
    // exclude group: 'org.jetbrains.kotlin'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version          : forge_version, forge_version_range: forge_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors            : mod_authors, mod_description: mod_description,]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }
    // reobfJar 已删（MDG 不需要）
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

// ===== 开发环境联机辅助 =====
// 首次启动 runServer 时自动同意 EULA 并关闭正版验证（dev 环境账号是离线的，必须 online-mode=false）
tasks.named('runServer') {
    doFirst {
        def dir = file('run-server')
        dir.mkdirs()
        // eula.txt
        def eula = new File(dir, 'eula.txt')
        if (!eula.exists() || !eula.text.contains('eula=true')) {
            eula.text = 'eula=true\n'
            println '[setup] 已自动写入 run-server/eula.txt (eula=true)'
        }
        // server.properties: online-mode=false
        def props = new File(dir, 'server.properties')
        if (props.exists()) {
            def text = props.text
            if (text.contains('online-mode=true')) {
                props.text = text.replace('online-mode=true', 'online-mode=false')
                println '[setup] 已将 run-server/server.properties 改为 online-mode=false'
            } else if (!text.contains('online-mode=')) {
                props.append('\nonline-mode=false\n')
                println '[setup] 已追加 online-mode=false 到 server.properties'
            }
        }
    }
}